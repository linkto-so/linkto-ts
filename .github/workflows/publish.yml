name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build packages
        run: pnpm build

      - name: Ensure latest npm CLI
        run: npm install -g npm@latest

      - name: Publish to npm
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          fi
          npm publish --provenance --access public
